<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print Team Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
  <h1 class="wordmark">Print Team Name</h1>

  <div class="sources">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="画像を選択">
      <strong>画像をドロップ / クリックして選択</strong>
      貼り付け（⌘V / Ctrl+V）でも読み込めます
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <section class="card">
      <h2>SPORTS NAVIから取り込む</h2>
      <div class="bar">
        <input type="url" id="pageUrl" placeholder="https://soccer.yahoo.co.jp/ws/category/por/standings">
        <button class="primary" id="grabRun">読み込む</button>
      </div>
    </section>
  </div>

  <div class="bar">
    <label class="field">表題 <input type="text" id="title" value="クラブ一覧" size="20"></label>
    <label class="field">列数 <input type="number" id="cols" value="2" min="1" max="3"></label>
    <span class="status" id="status"></span>
  </div>

  <div class="bar">
    <button class="primary" id="dl" disabled>A4用HTMLをダウンロード</button>
    <button id="open" disabled>新しいタブで開いて印刷</button>
    <button id="add" disabled>行を追加</button>
  </div>

  <div id="listWrap"><p class="empty">まだ何も読み込まれていません。</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
